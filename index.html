<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RELAXPLAY - Futuristic Brain-Training & Classic Games</title>
    <meta name="description" content="Nine timeless worlds. Endless ways to reset. Challenge your mind and find your calm with Mahjong Solitaire, Classic Solitaire, Block Puzzle, Chess Puzzles, Pipe Connect, Echo Path, One Line, Tiny Anomaly, and Hexa Flow." />
    <meta property="og:title" content="RELAXPLAY - Futuristic Brain-Training & Classic Games" />
    <meta property="og:description" content="Nine timeless worlds. Endless ways to reset. Challenge your mind and find your calm with Mahjong Solitaire, Classic Solitaire, Block Puzzle, Chess Puzzles, Pipe Connect, Echo Path, One Line, Tiny Anomaly, and Hexa Flow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07111F;
        transition: opacity 0.28s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: clamp(4rem, 22vw, 6rem);
        height: clamp(4rem, 22vw, 6rem);
        max-width: min(40vw, 6rem);
        max-height: min(40vh, 6rem);
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(86, 230, 208, 0.55));
        animation: boot-logo-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-logo-pulse {
        0%, 100% { transform: scale(1); opacity: 0.88; }
        50% { transform: scale(1.07); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#07111F] text-[#F1F7FF] selection:bg-[#56E6D0]/30 selection:text-[#56E6D0] antialiased min-h-screen">
    <div id="boot-splash" aria-hidden="true">
      <img src="/logo.png" alt="" width="96" height="96" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
